<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peptiva Supplies — Research Peptides</title>
    <meta name="description" content="Research peptides with third-party testing, supplied for laboratory research use only." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Diagnóstico de arranque: si la app no se monta en 8 s, muestra el error en pantalla en vez de dejarla en blanco
      window.__bootErrors = [];
      window.addEventListener("error", function (e) { window.__bootErrors.push((e.message || "error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")); }, true);
      window.addEventListener("unhandledrejection", function (e) { window.__bootErrors.push("promise: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason))); });
      setTimeout(function () {
        var root = document.getElementById("root");
        if (window.__appMounted || (root && root.children.length)) return;
        var info = (window.__bootErrors.join("\n") || "Sin errores capturados") + "\n\n" + navigator.userAgent;
        root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:80px auto;padding:0 20px;color:#1f2733">' +
          '<h1 style="color:#15426e;font-size:26px">The page didn\'t load</h1>' +
          '<p>Please reload. If this keeps happening, send this information to support@peptivasupplies.com.</p>' +
          '<button onclick="location.reload()" style="background:#15426e;color:#fff;border:0;border-radius:999px;padding:12px 24px;font-weight:600;cursor:pointer">Reload page</button>' +
          '<pre id="boot-info" style="margin-top:24px;white-space:pre-wrap;background:#f2f5f9;padding:14px;border-radius:12px;font-size:12px"></pre></div>';
        document.getElementById("boot-info").textContent = info;
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
